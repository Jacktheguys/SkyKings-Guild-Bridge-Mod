# Releases are automatic, driven by release-please and Conventional Commit messages:
#
#   1. Push commits to main titled e.g. "feat: /gpv accessories tab" or "fix: clicks on Lunar"
#      (feat = minor version, fix = patch, feat! / fix! = major).
#   2. release-please opens (or updates) a "chore(main): release x.y.z" PR with the changelog and
#      the version bump in gradle.properties.
#   3. Merging that PR creates the tag and the GitHub release; the build job checks the mod against
#      every Minecraft version and builds it, and the publish job attaches the jar and its SHA-256.
#   4. skykings.net/guild-bridge shows the new release within a few minutes (it reads this repo's
#      releases).
#
# To (re)build an existing version by hand: Actions → Release → Run workflow, with its tag (e.g. v1.3.3).
#
# Security: the build runs third-party code (Gradle plugins, dependencies), so it gets a read-only
# token, no secrets and no Gradle cache (nothing a PR or earlier run left behind can end up in a
# release). Only the publish job can write to releases, and it never runs build code: it just
# uploads the jar. Actions are pinned to commit SHAs (the tag is in the comment).
name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.3.3"
        required: true

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Which tag to build: the one release-please just made, or the one asked for by hand.
  target:
    needs: release-please
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: target
    if: always() && needs.target.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Check every Minecraft version
        run: |
          chmod +x gradlew scripts/check-versions.sh
          scripts/check-versions.sh

      - name: Build the jar
        env:
          MOD_VERSION: ${{ needs.target.outputs.version }}
        run: |
          ./gradlew clean build -Pmod_version="$MOD_VERSION" --no-daemon --stacktrace
          mkdir dist
          cp "build/libs/skykings-guild-bridge-$MOD_VERSION.jar" dist/

      - name: Write the download notes
        env:
          MOD_VERSION: ${{ needs.target.outputs.version }}
        run: |
          minecraft=$(jq -r '[.[].label] | reverse | join(", ")' versions.json)
          {
            echo
            echo "## Download"
            echo
            echo "\`skykings-guild-bridge-$MOD_VERSION.jar\`: one jar for every version below."
            echo
            echo "Minecraft: $minecraft"
            echo
            echo "Needs Fabric Loader, [Fabric API](https://modrinth.com/mod/fabric-api) and Java 25."
            echo
            echo "SHA-256:"
            echo '```'
            (cd dist && sha256sum *.jar)
            echo '```'
          } > dist/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jar
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [target, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.target.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-jar
          path: dist

      - name: Attach the jar and its checksum to the release
        run: |
          # A version published by hand (Run workflow) may not have a release yet.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          fi
          gh release view "$TAG" --json body --jq .body | sed '/^## Download$/,$d' > body.md
          cat body.md dist/notes.md > notes.md
          gh release edit "$TAG" --notes-file notes.md
          gh release upload "$TAG" dist/*.jar --clobber
