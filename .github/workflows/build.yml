name: Build

on:
  push:
  pull_request:

# Read-only: this workflow only builds, it never writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits (the tag is in the comment), so a moved tag can't change what runs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Checks gradle/wrapper/gradle-wrapper.jar is an official Gradle release before running it.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: skykings-guild-bridge
          path: build/libs/*.jar
