# Builds the mod on every push and pull request, checks it against every Minecraft version
# in versions.json, and keeps the jar as a download (not a release: see release.yml).
#
# Security: this runs PR code, so it only gets a read-only token and no secrets (plain
# `pull_request`, never `pull_request_target`). Actions are pinned to commit SHAs (the tag is
# in the comment) so a moved tag can't change what runs; Dependabot keeps them updated.
name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gradle/wrapper/gradle-wrapper.jar must be an official Gradle release before it runs.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # Only builds on main write the Gradle cache; PR builds just read it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check every Minecraft version
        run: |
          chmod +x gradlew scripts/check-versions.sh
          scripts/check-versions.sh

      - name: Build the jar
        run: ./gradlew clean build --no-daemon --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skykings-guild-bridge
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
